  /device-admin/condition:
    parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
    get:
      summary: Device Admin - Returns list of library conditions.
      description: Device Admin - Returns list of library conditions.
      operationId: getDeviceAdminConditions
      tags:
        - Device Administration - Conditions
      responses:
        '200':
          $ref: '#/components/responses/LibraryConditionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Device Admin - Creates a library condition.
      description: |
        Device Admin - Creates a library condition:
        <ul>
        <li> Library Condition has hierarchical structure which define a set of condition for which authentication and authorization policy rules could be match.</li>
        <li> Condition can be composed either from a single dictionary-attribute name and value pair using model <b>LibraryConditionAttributes</b>, or from a combination of 2 or more conditions with a logical relation (e.g AND/OR) using models: <b>LibraryConditionAndBlock</b> or <b>LibraryConditionOrBlock</b>.</li>
        <li> When using AND/OR blocks, the condition will include inner layers inside these blocks, these layers should be built using the inner condition models: <b>ConditionAttributes</b>, <b>ConditionAndBlock</b>, <b>ConditionOrBlock</b>; these represent dynamically built Conditions which do not get stored in the conditions Library, or using <b>ConditionReference</b>, which includes an ID of an existing condition which is in the library.</li>
        <li> The LibraryCondition models can only be used in the outer-most layer (root of the condition) and must always include the condition name.</li>
        <li> When using one of the 3 inner-layers condition models (<b>ConditionAttributes, ConditionAndBlock, ConditionOrBlock</b>), condition name cannot be included in the request, since these will not be stored in the conditions library, and used only as inner members of the root condition.</li>
        <li> When using <b>ConditionReference</b> model in inner layers, the condition name is not required.</li>
        <li> ConditionReference objects can also include a reference ID to a condition of type <b>TimeAndDate</b>.</li>
        <li> <b>NOTE:</b> The request body example provided in the Swagger UI is incomplete and cannot be used for creating a valid resource. Please refer to the 'Schema' section below, which offers details on the properties required to construct a valid request body for each condition model. Please note that the 'conditionType' property needs to be set according to the chosen model for each condition; In case of condition blocks (AND/OR), it is required for each of the inner-layer conditions as well.</li>
        </ul>
      operationId: postDeviceAdminCondition
      tags:
        - Device Administration - Conditions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Condition'
            example:
              name: Tacacs Condition
              description: My TACACS Condition Description
              dictionaryName: Network Access
              attributeName: EapAuthentication
              operator: notEquals
              attributeValue: EAP-TLS
              conditionType: LibraryConditionAttributes
              isNegate: false
      responses:
        '201':
          $ref: '#/components/responses/LibraryConditionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
