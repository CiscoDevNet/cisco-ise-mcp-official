components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  parameters:
    XRequestIdHeader:
      in: header
      name: X-Request-ID
      description: request Id, will return in the response headers, and appear in logs
      schema:
        type: string
      required: false
    PolicyParam:
      in: path
      name: policyId
      required: true
      schema:
        type: string
        format: uuid
      description: Policy id
      example: 12345678-f0e7-456b-a2d1-876543320b14
    RuleParam:
      in: path
      name: ruleId
      required: true
      schema:
        type: string
        format: uuid
      description: Rule id
      example: d82952cb-b901-4b09-b363-5ebf39bdbaf9
    ConditionParam:
      in: path
      name: conditionId
      required: true
      schema:
        type: string
        format: uuid
      description: Condition id
      example: abc952cb-b901-4b09-b363-5ebf39bdbaf9
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: '{code: 404, message: The specified resource was not found}'
    Forbidden:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: '{code: 403, message: operation forbidden}'
    Conflict:
      description: Conflict in the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: '{code: 409, message: Conflict}'
    Timeout:
      description: Request Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: '{code: 408, message: Request Timeout}'
    IdResponse:
      description: Response with object ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdResponseEntity'
    SuccessMessageResponse:
      description: Response with success message
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponseEntity'
    AuthenticationRuleResponse:
      description: Authentication Rule response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationRuleResponseEntity'
    AuthenticationRuleListResponse:
      description: Authentication Rule list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationRuleListResponseEntity'
    MfaRuleResponse:
      description: MFA Rule list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaRuleResponseEntity'
    MfaRuleListResponse:
      description: MFA Rule list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaRuleListResponseEntity'
    NetworkAccessAuthorizationRuleResponse:
      description: Network Access Authorization Rule response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkAccessAuthorizationRuleResponseEntity'
    NetworkAccessAuthorizationRuleListResponse:
      description: Network Access Authorization Rule list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NetworkAccessAuthorizationRuleListResponseEntity'
    DeviceAdminAuthorizationRuleResponse:
      description: Device Admin Authorization Rule response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceAdminAuthorizationRuleResponseEntity'
    DeviceAdminAuthorizationRuleListResponse:
      description: Device Admin Authorization Rule response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceAdminAuthorizationRuleListResponseEntity'
    PolicySetResponse:
      description: PolicySet response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicySetResponseEntity'
    PolicySetListResponse:
      description: List of network access policy sets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolicySetListResponseEntity'
    LibraryConditionResponse:
      description: Library condition object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryConditionResponseEntity'
          example:
            version: 1.0.0
            response:
              conditionType: LibraryConditionAttributes
              isNegate: false
              dictionaryName: Network Access
              attributeName: Device IP Address
              operator: ipEquals
              attributeValue: 10.10.10.10
              name: MyCondition
              id: 0869885e-abf6-4ed8-8a39-cad5514e6832
              description: Condition Description
              link:
                rel: self
                href: https://{{ISE_IP}}/api/v1/policy/{{protocol}}/condition/0869885e-abf6-4ed8-8a39-cad5514e6832
                type: application/json
    LibraryConditionListResponse:
      description: List of library conditions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LibraryConditionListResponseEntity'
    DictionaryListResponse:
      description: Response containing DictionaryListResponseEntity object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DictionaryListResponseEntity'
    DictionaryResponse:
      description: Response containing DictionaryResponseEntity object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DictionaryResponseEntity'
    DictionaryAttributeResponse:
      description: Response containaing DictionaryAttributeResponseEntity Object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DictionaryAttributeResponseEntity'
    DictionaryAttributeListResponse:
      description: list of DictionaryAttributeResponseEntity objects
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DictionaryAttributeListResponseEntity'
  headers:
    Cache-Control:
      schema:
        enum:
          - no-cache
          - no-store
          - must-revalidate
        default: no-cache
        example: no-cache
    Pragma:
      schema:
        type: string
        default: no-cache
        example: no-cache
    Content-Type:
      schema:
        type: string
        example: application/json; charset=UTF-8
    Strict-Transport-Security:
      schema:
        type: string
        example: max-age=31536000; includeSubDomains
    X-Content-Type-Options:
      schema:
        type: string
        default: nosniff
        example: nosniff
    X-Frame-Options:
      schema:
        type: string
        default: SAMEORIGIN
        example: SAMEORIGIN
    X-XSS-Protection:
      schema:
        type: string
        default: 1; mode=block
        example: 1; mode=block
    Server:
      schema:
        type: string
        default: null
        example: null
    Connection:
      schema:
        enum:
          - keep-alive
          - close
        default: close
        example: keep-alive
    Content-Encoding:
      schema:
        type: string
        default: gzip
        example: gzip
    Date:
      schema:
        type: string
        example: Sun, 01 Sep 2020 07:53:54 GMT
    Expires:
      schema:
        type: string
        example: Thu, 01 Jan 1970 00:00:00 GMT
    Transfer-Encoding:
      schema:
        type: string
        example: chunked
    Vary:
      schema:
        type: string
        example: accept-encoding
    Content-Security-Policy:
      schema:
        type: string
        example: default-src 'self'
    X-Request-ID:
      description: request Id, must be in logs too
      schema:
        type: string
        example: '1234'
  schemas:
    PolicySet:
      type: object
      description: Policy set structure
      required:
        - name
        - serviceName
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identifier for the policy set
          example: 12345678-f0e7-456b-a2d1-876543320b14
        name:
          type: string
          description: Given name for the policy set, [Valid characters are alphanumerics, underscore, hyphen, space, period, parentheses]
          pattern: ^[\w\-\.\(\)\ ]+$
          example: My_policy_set 1
        description:
          type: string
          description: The description for the policy set
          pattern: ^$|^[^\%\<\>]+$
          example: My Description
        hitCounts:
          type: integer
          readOnly: true
          description: The amount of times the policy was matched
          default: 0
          example: 5
        rank:
          description: The rank(priority) in relation to other policy set. Lower rank is higher priority.
          type: integer
          default: 0
          example: 0
        state:
          description: The state that the policy set is in. A disabled policy set cannot be matched.
          type: string
          enum:
            - enabled
            - disabled
            - monitor
          default: enabled
          example: enabled
        default:
          description: Flag which indicates if this policy set is the default one
          type: boolean
          readOnly: true
          default: false
          example: true
        condition:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Condition'
        serviceName:
          description: Policy set service identifier - Allowed Protocols,Server Sequence..
          type: string
          example: Default Network Access
        isProxy:
          description: Flag which indicates if the policy set service is of type 'Proxy Sequence' or 'Allowed Protocols'
          type: boolean
          default: false
          example: false
        link:
          $ref: '#/components/schemas/Link'
    Dictionary:
      type: object
      description: Dictionary POST format
      required:
        - name
        - version
        - dictionaryAttrType
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identifier for the dictionary
          example: 12345678-f0e7-456b-a2d1-876543320b17
        name:
          type: string
          pattern: ^[\w\-\.\ ]+$
          description: The dictionary name
          example: my dictionary
        description:
          type: string
          description: The description of the Dictionary
          example: a dictionary description
        version:
          type: string
          pattern: ^[0-9]+(.[0-9]+){0,2}$
          description: The dictionary version
          example: 1.2
        dictionaryAttrType:
          type: string
          description: The dictionary attribute type
          enum:
            - ENTITY_ATTR
            - MSG_ATTR
            - PIP_ATTR
          example: ENTITY_ATTR
        link:
          $ref: '#/components/schemas/Link'
    DictionaryAttribute:
      type: object
      description: Dictionary Attribute format
      required:
        - name
        - internalName
        - dataType
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identifier for the dictionary attribute
          example: 12345678-f0e7-456b-a2d1-876543320b11
        directionType:
          type: string
          enum:
            - IN
            - OUT
            - NONE
            - BOTH
          readOnly: true
          description: the direction for the useage of the dictionary attribute
          example: BOTH
        name:
          type: string
          pattern: ^[^|*,=\]\[:\"^><~'׳\\%}{$]+$
          description: The dictionary attribute's name
          example: my dictionary attribute
        description:
          type: string
          description: The description of the Dictionary attribute
          example: a dictionary attribute description
        internalName:
          type: string
          description: the internal name of the dictionary attribute
          example: my dictionary attribute internal name
        dataType:
          type: string
          description: the data type for the dictionary attribute
          enum:
            - BOOLEAN
            - DATE
            - FLOAT
            - INT
            - IP
            - IPV4
            - IPV6
            - IPV6INTERFACE
            - IPV6PREFIX
            - LONG
            - OCTET_STRING
            - STRING
            - UNIT32
            - UINT64
          example: IPV6
        dictionaryName:
          type: string
          description: the name of the dictionary which the dictionary attribute belongs to
          example: my dictionary
        allowedValues:
          type: array
          description: all of the allowed values for the dictionary attribute
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
              value:
                type: string
              isDefault:
                type: boolean
                description: true if this key value is the default between the allowed values of the dictionary attribute
                default: false
                example: true
          example:
            - key: key1
            - value: value1
            - isDefault: true
    RuleAuthentication:
      description: Rule for authentication in Network Access/Device Admin
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/RuleCommon'
        identitySourceName:
          type: string
          description: Identity source name from the identity stores
          default: Internal Users
          example: Internal Endpoints
        ifAuthFail:
          type: string
          description: Action to perform when authentication fails such as Bad credentials, disabled user and so on
          default: reject
          example: reject
        ifUserNotFound:
          type: string
          description: Action to perform when user is not found in any of identity stores
          default: reject
          example: reject
        ifProcessFail:
          type: string
          description: Action to perform when ISE is uanble to access the identity database
          default: drop
          example: drop
        link:
          $ref: '#/components/schemas/Link'
    RuleMfa:
      description: Rule for MFA in Network Access/Device Admin
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/RuleCommon'
        mfaConnectionName:
          type: string
          description: MFA Connection name for MFA
          default: api-XXXXXXXX.duosecurity.com
          example: api-XXXXXXXX.duosecurity.com
        mfaFailAction:
          type: string
          description: Action to perform when MFA fails
          default: REJECT
          example: REJECT
        mfaResultAction:
          type: string
          description: Action to perform when MFA is successful
          default: ACCEPT
          example: ACCEPT
        link:
          $ref: '#/components/schemas/Link'
    RuleAuthorizationNetworkAccess:
      description: Authorization rule for network access
      type: object
      minProperties: 2
      required:
        - rule
      properties:
        rule:
          $ref: '#/components/schemas/RuleCommon'
        profile:
          description: The authorization profile/s
          type: array
          items:
            type: string
          example:
            - PermitAccess
            - NSP_Onboard
        securityGroup:
          description: Security group used in authorization policies
          type: string
          example: BYOD
        link:
          $ref: '#/components/schemas/Link'
    RuleAuthorizationDeviceAdmin:
      description: Authorization rule for device admin
      type: object
      minProperties: 2
      required:
        - rule
      properties:
        rule:
          $ref: '#/components/schemas/RuleCommon'
        commands:
          description: Command sets enforce the specified list of commands that can be executed by a device administrator
          type: array
          items:
            type: string
          example:
            - DenyAllCommands
        profile:
          description: Device admin profiles control the initial login session of the device administrator
          type: string
          example: Default Shell Profile
        link:
          $ref: '#/components/schemas/Link'
    RuleCommon:
      description: Common attributes in rule authentication/authorization
      type: object
      required:
        - name
      properties:
        id:
          description: The identifier of the rule
          type: string
          readOnly: true
          format: uuid
          example: d82952cb-b901-4b09-b363-5ebf39bdbaf9
        name:
          description: Rule name, [Valid characters are alphanumerics, underscore, hyphen, space, period, parentheses]
          type: string
          pattern: ^[\w\-\.\(\)\ ]+$
          example: MyRuleName_1
        hitCounts:
          description: The amount of times the rule was matched
          type: integer
          readOnly: true
          default: 0
          example: 2
        rank:
          description: The rank(priority) in relation to other rules. Lower rank is higher priority.
          type: integer
          default: 0
          example: 1
        state:
          description: The state that the rule is in. A disabled rule cannot be matched.
          type: string
          enum:
            - enabled
            - disabled
            - monitor
          default: enabled
          example: enabled
        default:
          description: Indicates if this rule is the default one
          type: boolean
          default: false
          example: false
        condition:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Condition'
    Condition:
      type: object
      description: <ul><li>Hierarchical structure which defines a set of conditions for which authentication or authorization policy rules could be matched.</li> <li>Logical operations(AND, OR) relationship between conditions are supported</li> <li>Each condition can have subconditions with relation to logical operations</li></ul>
      required:
        - conditionType
      properties:
        link:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Link'
        conditionType:
          description: <ul><li>Inidicates whether the record is the condition itself(data) or a logical(or,and) aggregation</li> <li>Data type enum(reference,single) indicates than "conditonId" OR "ConditionAttrs" fields should contain condition data but not both</li> <li>Logical aggreation(and,or) enum indicates that additional conditions are present under the children field</li></ul>
          type: string
          enum:
            - ConditionReference
            - ConditionAttributes
            - LibraryConditionAttributes
            - ConditionAndBlock
            - LibraryConditionAndBlock
            - ConditionOrBlock
            - LibraryConditionOrBlock
            - TimeAndDateCondition
          example: ConditionAttributes
        isNegate:
          type: boolean
          description: Indicates whereas this condition is in negate mode
          default: false
          example: false
      discriminator:
        propertyName: conditionType
        mapping:
          ConditionReference: '#/components/schemas/ConditionReference'
          ConditionAttributes: '#/components/schemas/ConditionAttributes'
          LibraryConditionAttributes: '#/components/schemas/LibraryConditionAttributes'
          ConditionAndBlock: '#/components/schemas/ConditionAndBlock'
          LibraryConditionAndBlock: '#/components/schemas/LibraryConditionAndBlock'
          ConditionOrBlock: '#/components/schemas/ConditionOrBlock'
          LibraryConditionOrBlock: '#/components/schemas/LibraryConditionOrBlock'
          TimeAndDateCondition: '#/components/schemas/TimeAndDateCondition'
    ConditionReference:
      allOf:
        - $ref: '#/components/schemas/Condition'
        - type: object
          description: An object that contains a reference ID to a stored Library Condition
          required:
            - id
          properties:
            name:
              type: string
              description: Library condition name
              example: Radius Condition
              readOnly: true
            id:
              type: string
              format: uuid
              description: UUID for condition
              example: 12345678-f0e7-456b-a2d1-876543320123
            description:
              type: string
              description: Condition description
              readOnly: true
              pattern: ^$|^[^\%\<\>]+$
              example: Match only radius requests
    ConditionAttributes:
      allOf:
        - $ref: '#/components/schemas/Condition'
        - type: object
          description: Condition attributes data
          required:
            - dictionaryName
            - attributeName
            - operator
            - attributeValue
          properties:
            dictionaryName:
              type: string
              description: Dictionary name
              example: Network Access
            attributeName:
              type: string
              description: Dictionary attribute name
              example: UserName
            operator:
              type: string
              enum:
                - equals
                - notEquals
                - contains
                - notContains
                - matches
                - in
                - notIn
                - startsWith
                - notStartsWith
                - endsWith
                - notEndsWith
                - greaterThan
                - lessThan
                - greaterOrEquals
                - lessOrEquals
                - ipGreaterThan
                - ipLessThan
                - ipEquals
                - ipNotEquals
                - macEquals
                - macNotEquals
                - macNotIn
                - macIn
                - macStartsWith
                - macNotStartsWith
                - macEndsWith
                - macNotEndsWith
                - macContains
                - macNotContains
                - dateGreaterThan
                - dateLessThan
              description: Equality operator
              example: equals
            dictionaryValue:
              type: string
              description: Dictionary value
              example: Radius
            attributeValue:
              type: string
              pattern: ^$|^[^\%\<\>]+$
              description: <ul><li>Attribute value for condition</li> <li>Value type is specified in dictionary object</li> <li>if multiple values allowed is specified in dictionary object</li></ul>
              example: cisco
    LibraryConditionAttributes:
      allOf:
        - $ref: '#/components/schemas/ConditionAttributes'
        - required:
            - name
          properties:
            name:
              type: string
              description: Condition name, [Valid characters are alphanumerics, underscore, hyphen, space]
              pattern: ^[\w\-\ ]+$
              example: Wired_MAB
            id:
              type: string
              format: uuid
              description: condition ID
              example: 12345678-f0e7-456b-a2d1-876543320123
            description:
              type: string
              pattern: ^$|^[^\%\<\>]+$
              description: Conditiopn description
              example: Match only radius requests
              default: ''
    ConditionAndBlock:
      allOf:
        - $ref: '#/components/schemas/Condition'
        - type: object
          description: Block of children conditions with 'AND' relationship
          required:
            - children
          properties:
            children:
              description: In case type is andBlock or orBlock addtional conditions will be aggregated under this logical (OR/AND) condition
              type: array
              items:
                $ref: '#/components/schemas/Condition'
              minItems: 1
              example:
                - name: Radius condition
                  description: Match only radius requests
                  id: ad947f38-7063-4da2-8723-652e0ca2ea41
                  conditionType: ConditionReference
                  isNegate: false
                - name: Tacacs condition
                  description: Match only tacacs condition
                  id: ad947f38-7063-4da2-8723-652e0ca2eb52
                  conditionType: ConditionReference
                  isNegate: false
    LibraryConditionAndBlock:
      allOf:
        - $ref: '#/components/schemas/ConditionAndBlock'
        - required:
            - name
          description: Library condition AND block with full details
          properties:
            name:
              type: string
              description: Condition name, [Valid characters are alphanumerics, underscore, hyphen, space]
              pattern: ^[\w\-\ ]+$
              example: Children conditions OR Block
            id:
              type: string
              format: uuid
              description: condition ID
              example: 12345678-f0e7-456b-a2d1-876543320123
            description:
              type: string
              description: Condition description
              pattern: ^$|^[^\%\<\>]+$
              example: Match only radius requests
              default: ''
    ConditionOrBlock:
      allOf:
        - $ref: '#/components/schemas/Condition'
        - type: object
          description: Block of children conditions with 'OR' relationship
          required:
            - children
          properties:
            children:
              description: In case type is andBlock or orBlock addtional conditions will be aggregated under this logical (OR/AND) condition
              type: array
              items:
                $ref: '#/components/schemas/Condition'
              minItems: 1
              example:
                - name: Radius condition
                  description: Match only radius requests
                  id: ad947f38-7063-4da2-8723-652e0ca2ea41
                  conditionType: ConditionReference
                  isNegate: false
                - name: Tacacs condition
                  description: Match only tacacs condition
                  id: ad947f38-7063-4da2-8723-652e0ca2eb52
                  conditionType: ConditionReference
                  isNegate: false
    LibraryConditionOrBlock:
      allOf:
        - $ref: '#/components/schemas/ConditionOrBlock'
        - description: Library condition OR block with full details
          required:
            - name
          properties:
            name:
              type: string
              description: Condition name, [Valid characters are alphanumerics, underscore, hyphen, space]
              pattern: ^[\w\-\ ]+$
              example: Children_Block
            id:
              type: string
              format: uuid
              description: condition ID
              example: 12345678-f0e7-456b-a2d1-876543320123
            description:
              type: string
              description: Condition description
              pattern: ^$|^[^\%\<\>]+$
              example: Match only radius requests
              default: ''
    NetworkCondition:
      description: Unique network conditions to restrict access to the network
      type: object
      required:
        - name
        - conditionType
      properties:
        link:
          $ref: '#/components/schemas/Link'
        name:
          description: Network Condition name
          type: string
          pattern: ^[\w\ ]+$
          example: My network condition
        id:
          type: string
          format: uuid
          readOnly: true
          example: 07da6fd8-5abc-4dc4-bcec-df309dbf4d17
        description:
          type: string
          pattern: ^$|^[^\%\<\>]+$
          example: Network Condition Description
        conditionType:
          description: This field determines the content of the conditions field
          type: string
          enum:
            - EndstationCondition
            - DeviceCondition
            - DevicePortCondition
          example: EndstationCondition
      discriminator:
        propertyName: conditionType
        mapping:
          EndstationCondition: '#/components/schemas/EndstationCondition'
          DeviceCondition: '#/components/schemas/DeviceCondition'
          DevicePortCondition: '#/components/schemas/DevicePortCondition'
    EndstationCondition:
      allOf:
        - $ref: '#/components/schemas/NetworkCondition'
        - description: Cisco ISE evaluates the remote address TO field (which is obtained based on whether it is a TACACS+ or RADIUS request) to identify whether it is the IP address, MAC address, calling line identification (CLI), or dialed number identification service (DNIS) of the endpoint.
          properties:
            ipAddrList:
              description: <p>This field should contain IP address or subnet.<br> IP address can be IPV4 format (n.n.n.n) or IPV6 format (n:n:n:n:n:n:n:n).<br> IP subnet can be IPV4 format (n.n.n.n/m) or IPV6 format (n:n:n:n:n:n:n:n/m).<br> Line format - IP Address or subnet</p>
              type: array
              items:
                type: string
              example:
                - 1.1.1.1
                - 2.2.2.2
            macAddrList:
              description: <p>This field should contain Endstation MAC address, comma, and Destination MAC addresses.<br> Each Max address must include twelve hexadecimal digits using formats nn:nn:nn:nn:nn:nn or nn-nn-nn-nn-nn-nn or nnnn.nnnn.nnnn or nnnnnnnnnnnn.<br> Line format - Endstation MAC,Destination MAC </p>
              type: array
              items:
                type: string
              example:
                - 00-0E-A6-A7-63-F7,00-0E-A6-A7-63-F8
                - 00-0E-A6-A7-63-F7,-ANY-
                - '-ANY-,00-0E-A6-A7-63-F8'
            cliDnisList:
              description: <p>This field should contain a Caller ID (CLI), comma, and Called ID (DNIS).<br> Line format -  Caller ID (CLI), Called ID (DNIS)</p>
              type: array
              items:
                type: string
              example:
                - 00-0E-A6-A7-63-F7,00-0E-A6-A7-63-F8
                - 00-0E-A6-A7-63-F7,-ANY-
    DeviceCondition:
      allOf:
        - $ref: '#/components/schemas/NetworkCondition'
        - description: A network device can be identified by its IP address, device name that is defined in the network device repository, or Network Device Group.
          properties:
            ipAddrList:
              description: <p>This field should contain IP address or subnet.<br> IP address can be IPV4 format (n.n.n.n) or IPV6 format (n:n:n:n:n:n:n:n).<br> IP subnet can be IPV4 format (n.n.n.n/m) or IPV6 format (n:n:n:n:n:n:n:n/m).<br> Line format - IP Address or subnet</p>
              type: array
              items:
                type: string
              example:
                - 1.1.1.1
                - 2.2.2.2
            deviceList:
              description: <p>This field should contain Device Name. The device name must be the same as the name field in a Network Device object. Line format - Device Name</p>
              type: array
              items:
                type: string
              example:
                - MyDevice1
                - MyDevice2
            deviceGroupList:
              description: <p>This field should contain a tuple with NDG Root, comma, and an NDG (that it under the root).<br> Line format - NDG Root Name, NDG, Port</p>
              type: array
              items:
                type: string
              example:
                - IPSEC#Is IPSEC Device
                - Location#All Locations
    DevicePortCondition:
      allOf:
        - $ref: '#/components/schemas/NetworkCondition'
        - description: Based on the device's IP address, name, NDG, and port
          properties:
            ipAddrList:
              description: <p>This field should contain IP-address-or-subnet,port number<br> IP address can be IPV4 format (n.n.n.n) or IPV6 format (n:n:n:n:n:n:n:n).<br> IP subnet can be IPV4 format (n.n.n.n/m) or IPV6 format (n:n:n:n:n:n:n:n/m).<br> Line format - IP Address or subnet,Port</p>
              type: array
              items:
                type: string
              example:
                - 1.1.1.1,80
                - 2.2.2.2,443
            deviceList:
              description: <p>This field should contain Device-Name,port-number. The device name must be the same as the name field in a Network Device object.<br> Line format - Device Name,Port</p>
              type: array
              items:
                type: string
              example:
                - MyDevice1,80
                - MyDevice2,443
            deviceGroupList:
              description: <p>This field should contain a tuple with NDG Root, comma, and an NDG (that it under the root).<br> Line format - NDG Root Name, NDG, Port</p>
              type: array
              items:
                type: string
              example:
                - IPSEC#Is IPSEC Device,-ANY-
                - Location#All Locations,80
    TimeAndDateCondition:
      description: Condition based on time and date.
      allOf:
        - $ref: '#/components/schemas/Condition'
        - required:
            - name
          properties:
            name:
              description: Condition name
              type: string
              pattern: ^[\w\-\ ]+$
              example: TimeAndDate Condition
            id:
              type: string
              format: uuid
            description:
              type: string
              description: Condition description
              pattern: ^$|^[^\%\<\>]+$
              default: ''
              example: Optional description
            hoursRange:
              $ref: '#/components/schemas/HoursRange'
            hoursRangeException:
              $ref: '#/components/schemas/HoursRange'
            weekDays:
              description: <p>Defines for which days this condition will be matched<br> Days format - Arrays of WeekDay enums <br> Default - List of All week days</p>
              type: array
              items:
                $ref: '#/components/schemas/WeekDayEnum'
              minItems: 1
              default:
                - Sunday
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
              example:
                - Sunday
                - Monday
                - Tuesday
            weekDaysException:
              description: <p>Defines for which days this condition will NOT be matched<br> Days format - Arrays of WeekDay enums <br> Default - Not enabled</p>
              type: array
              items:
                $ref: '#/components/schemas/WeekDayEnum'
              example:
                - Tuesday
            datesRange:
              $ref: '#/components/schemas/DatesRange'
            datesRangeException:
              $ref: '#/components/schemas/DatesRange'
    DatesRange:
      type: object
      description: <p>Defines for which date/s TimeAndDate condition will be matched<br> Options are - Date range, for specific date, the same date should be used for start/end date <br> Default - no specific dates<br> In order to reset the dates to have no specific dates Date format - yyyy-mm-dd (MM = month, dd = day, yyyy = year)</p>
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^\d{4}\-(0[1-9]|1[012])\-(0[1-9]|[12][0-9]|3[01])$
          example: '2022-05-06'
        endDate:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^\d{4}\-(0[1-9]|1[012])\-(0[1-9]|[12][0-9]|3[01])$
          example: '2022-05-10'
    HoursRange:
      required:
        - startTime
        - endTime
      description: <p>Defines for which hours a TimeAndDate condition will be matched<br> Time foramt - hh:mm  ( h = hour , mm = minutes ) <br> Default - All Day </p>
      type: object
      properties:
        startTime:
          type: string
          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
          example: '08:00'
        endTime:
          type: string
          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
          example: '15:00'
    WeekDayEnum:
      type: string
      enum:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
