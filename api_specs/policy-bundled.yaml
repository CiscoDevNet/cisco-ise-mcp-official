  /device-admin/dictionaries/authorization:
    parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
    get:
      summary: Network Access - Returns list of dictionary attributes for authorization.
      description: Network Access - Returns list of dictionary attributes for authorization.
      operationId: getDeviceAdminDictionariesAuthorization
      tags:
        - Device Administration - Dictionary Attributes List
      responses:
        '200':
          $ref: '#/components/responses/DictionaryAttributeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /device-admin/dictionaries/policyset:
    parameters:
