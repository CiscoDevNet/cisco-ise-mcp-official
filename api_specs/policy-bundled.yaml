openapi: 3.0.2
info:
  title: Policy APIs
  description: <p> Policy APIs for managing Policy Sets, authorization policies, authentication policies, and policy elements. <br> Policy API audit report can be found in ISE UI under Operations-> Reports -> Policy OpenApi Operations report. </p>
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    email: cs-ise-api@cisco.com
servers:
  - url: https://{server}/v1/policy
    variables:
      server:
        default: localhost
        description: The host where the API is rooted
security:
  - BasicAuth: []
paths:
  /network-access/policy-set:
    parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
    get:
      summary: Network Access - List of policy sets.
      description: Get all network access policy sets.
      operationId: getNetworkAccessPolicySetList
      tags:
        - Network Access - Policy Sets
      responses:
        '200':
          $ref: '#/components/responses/PolicySetListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Network Access - Create a new policy set.
      description: |
        Network Access - Create a new policy set:
        <ul>
        <li> Policy must include name , service identifier (either server sequence or allowed protocol) and a condition. </li>
        <li> Condition has hierarchical structure which define a set of condition for which policy could be match. </li>
        <li> Condition can be either reference to a stored Library condition, using model <b>ConditionReference</b>,
        or, dynamically built conditions which are not stored in the conditions Library, using models <b>ConditionAttributes, ConditionAndBlock, ConditionOrBlock</b>.</li>
        <li> <b>NOTE:</b> The condition property in the request body example provided in the Swagger UI is incomplete and cannot be used for creating a valid resource. Please refer to the 'Schema' section below, which offers details on the properties required to construct a valid request body for each condition model. Please note that the 'conditionType' property needs to be set according to the chosen model for each condition; In case of condition blocks (AND/OR), it is required for each of the inner-layer conditions as well.</li>
        </ul>
      operationId: createNetworkAccessPolicySet
      tags:
        - Network Access - Policy Sets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySet'
            example:
              name: My PolicySet
              description: A new policySet
              state: enabled
              condition:
                conditionType: ConditionAttributes
                isNegate: false
                dictionaryName: Network Access
                attributeName: Device IP Address
                operator: ipEquals
                attributeValue: 10.0.10.0
              serviceName: Default Network Access
              isProxy: false
      responses:
        '201':
          $ref: '#/components/responses/PolicySetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /network-access/policy-set/reset-hitcount:
    parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
    post:
      summary: Network Access - Reset HitCount for PolicySets
      description: Network Access - Reset HitCount for PolicySets
      operationId: resetHitCountsNetworkAccessPolicySets
      tags:
