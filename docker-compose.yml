#
# Run:
#   docker compose up
#
# Development mode with debug:
#   DEV=true DEBUG=true docker compose up --build

services:
  ise-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV: "${DEV:-false}"
        DEBUG: "${DEBUG:-false}"
    image: ise-mcp-server
    container_name: ise-mcp-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    # Client-certificate auth: the ISE_CLIENT_CERT / ISE_CLIENT_KEY /
    # ISE_CA_BUNDLE paths in .env must be CONTAINER paths, and the files must
    # exist inside the container (settings validation fails loud at startup
    # otherwise). Mount them read-only from a host ./certs directory rather
    # than baking key material into the image, and point the .env paths at
    # /certs, e.g. ISE_CLIENT_CERT=/certs/client.pem. Uncomment to enable:
    # volumes:
    #   - ./certs:/certs:ro
    restart: unless-stopped
